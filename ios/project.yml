name: ZCodeRemote
options:
  bundleIdPrefix: dev.zcode
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic

targets:
  ZCodeRemote:
    type: application
    platform: iOS
    sources:
      - path: ZCodeRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zcode.remote
        MARKETING_VERSION: "1.9.0"
        CURRENT_PROJECT_VERSION: "8"
        TARGETED_DEVICE_FAMILY: "1,2"
        # 图片资源：AppIcon 由 actool 编进 Assets.car 并写入 Info.plist 的图标条目；
        # 不设这两项时 xcassets 只会编成资源包，桌面仍显示系统占位图标。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: ZCodeRemote/Info.plist
      properties:
        CFBundleDisplayName: ZCode Remote
        CFBundleShortVersionString: "1.9.0"
        CFBundleVersion: "8"
        UILaunchScreen: {}
        NSCameraUsageDescription: 需要相机权限才能扫描电脑端 ZCode 的远程访问二维码。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

schemes:
  ZCodeRemote:
    build:
      targets:
        ZCodeRemote: all
    run:
      config: Debug
