name: ios-build

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen

      - name: Build Unsigned IPA
        run: |
          # 1. 归档真机版本 (禁用签名)
          xcodebuild -project ios/ZCodeRemote.xcodeproj -scheme ZCodeRemote \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath ios/build/ZCodeRemote.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

          # 2. 手动打包成无签名 IPA
          mkdir -p ios/build/Payload
          cp -R ios/build/ZCodeRemote.xcarchive/Products/Applications/ZCodeRemote.app ios/build/Payload/
          cd ios/build && zip -r ZCodeRemote-unsigned.ipa Payload

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ios/build/ZCodeRemote-unsigned.ipa
